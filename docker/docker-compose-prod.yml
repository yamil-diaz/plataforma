services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: aeternum
      POSTGRES_USER: aeternum
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambiar_esto_seguro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeternum"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PADDLE_CLIENT_TOKEN: ${VITE_PADDLE_CLIENT_TOKEN:-}
        VITE_PADDLE_ENVIRONMENT: ${VITE_PADDLE_ENVIRONMENT:-sandbox}
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://aeternum:${DB_PASSWORD:-cambiar_esto_seguro}@db:5432/aeternum
      - SECRET_KEY=${SECRET_KEY:-generar-con-openssl-rand-hex-32}
      - ENV=production
      - RENDER=false
      - STORAGE_DIR=/data/aeternum
      - CORS_ORIGINS=${CORS_ORIGINS:-https://aeternumlibrary.com}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - PADDLE_API_KEY=${PADDLE_API_KEY:-}
      - PADDLE_CLIENT_TOKEN=${PADDLE_CLIENT_TOKEN:-}
      - PADDLE_WEBHOOK_SECRET=${PADDLE_WEBHOOK_SECRET:-}
      - PADDLE_ENVIRONMENT=${PADDLE_ENVIRONMENT:-sandbox}
    volumes:
      - aeternum-data:/data/aeternum

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    volumes:
      - ./nginx-ssl.conf:/etc/nginx/nginx.conf:ro
      - aeternum-data:/data/aeternum:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  aeternum-data:
  certbot-webroot:
  certbot-certs:
